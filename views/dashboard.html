<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <header>
        <div class="header-container" >
            
            <button id="backbtn"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.99999 15.8333L4.16666 9.99999L9.99999 4.16666" stroke="white" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M15.8333 10H4.16666" stroke="white" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    <p>Back to Home</p></button>
            <h2>City Guide</h2>
        </div>
    </header>

    <section class="icon" style="margin-top: 45px;">
        <div class="container">
            <div class="icon-info">
                <div class="icon-person"><svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg></div>
                <h2 id="username"></h2>
                
            </div>

        </div>
    </section>

    <section class="selection">
        <div class="container selection-container">
            <div class="switch">
                <div class="slider"></div>
                    <button class="option active">Profile</button>
                    <button class="option">Documents</button>
                </div>
            </div>

    </section>

    <section class="profile">


        <div class="container profile-container" style="margin-bottom: 50px;">
            <div class="personal-info">
                <h3 class="Person-info">Personal Information</h3>
                <div>

                    <p>Full Name</p>
                    <form action="" method="post" class="info-form" id="info-form">
                        <input type="text" value="" id="dashboard-name">
                        <button type="button" id="toggle" class="toggle">Edit</button>
                        <div class="box" id="box">
                            <button>Save</button>
                            <button id="cancel" type="button">Cancel</button>
                        </div>
                    </form>
                    
                </div>

                <div>

                    <p>Email Address</p>
                    <form action="" method="post" class="info-form info-form1" id="info-form1">
                        <input type="text" value="" id="dashboard-email">
                        <button type="button" class="toggle" id="toggle1">Edit</button>
                        <div class="box box1" id="box1">
                            <button>Save</button>
                            <button id="cancel1" type="button">Cancel</button>
                        </div>
                    </form>
                    
                </div>
            </div>


            <div class="account-settings">
                <h3 class="Person-settings">Personal Information</h3>
                <div class="section">
                    
                    <button class="section-header">
                        🔒 Change Password
                    </button>

                    <div class="section-content">
                        <input placeholder="Current password">
                        <input placeholder="New password">
                        <input placeholder="Confirm new password">
                        <button class="submit">Update Password</button>
                    </div>
                </div>
                <div class="section"><button class="section-header logoutbtn" id="logout-btn">Logout</button> </div>
            </div>
        </div>


    </section>
<!-- #6771fe -->
    <script>


        const name = document.getElementById('name')
    // const signIn = document.getElementById('signin-btn')
        


        fetch('/api/me')
        .then(res => {
            if (res.status === 401) {
            location.href = '/login';
            return;
            }
            return res.json();
        })
        // .then(user => {
        //     document.body.innerHTML += 'Привет, ' + user.name;
        // });

        async function loadUser() {
            const res = await fetch("/api/me");
            const user = await res.json();
            
            document.getElementById("username").textContent = user.name;
            document.getElementById("dashboard-name").value = user.name;
            document.getElementById("dashboard-email").value = user.email;
           
        }

        loadUser();


        fetch('/api/dashboard')
        .then(res => res.json())
        .then(data => {
            console.log(data);
        });
    </script>

    <script src="/js/dashboard.js"></script>
</body>
</html>

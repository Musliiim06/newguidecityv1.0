<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/logstyle.css">
</head>
<body>
    <div class="container" >
        <h2>City Guide</h2>
        <p>Sign in to explore the city</p>
        <form action="/login" method="post" class="inputlogin">
            <p>Email</p>
            <input class="user" name="email" type="email" placeholder="email">
            <p>Password</p>
            <input class="password" name="password" type="password" placeholder="password">
            <a href="" class="forgotbn" >Forgot password?</a>

            <button class="signinbtn" type="submit">Sign In</button>
        </form>
        
        
        <p class="paragraph">New to City Guide?</p>

        <a href="/register" class="createbtn">Create account</a>

    </div>
</body>
</html>
